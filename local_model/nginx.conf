# nginx.conf — reverse proxy for vLLM with API-key authentication
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 128;

    limit_req_zone $http_authorization zone=api_limit:10m rate=10r/s;

    map $http_authorization $api_key_valid {
        default 0;
        include /etc/nginx/conf.d/api_keys.conf;
    }

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_authorization" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $vllm_upstream http://vllm:8000;

        location = /health {
            proxy_pass $vllm_upstream/health;
        }

        location /v1/ {
            if ($api_key_valid = 0) {
                add_header Content-Type application/json always;
                return 401 '{"error":"Invalid or missing API key. Use -H \"Authorization: Bearer <your-key>\"."}';
            }

            limit_req zone=api_limit burst=30 nodelay;

            proxy_read_timeout    300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;

            proxy_pass         $vllm_upstream;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        location / {
            add_header Content-Type application/json;
            return 200 '{"message":"Qwen2.5-14B-Instruct API. Use /v1/chat/completions"}';
        }
    }
}