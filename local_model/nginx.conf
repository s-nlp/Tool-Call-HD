# nginx.conf — reverse proxy for vLLM with API-key authentication
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting
    # 10 requests/second sustained, burst up to 30
    limit_req_zone $http_authorization zone=api_limit:10m rate=10r/s;

    # API key map
    # Keys are read from api_keys.conf (one per line, format below)
    map $http_authorization $api_key_valid {
        default          0;
        include          /etc/nginx/api_keys.conf;
    }

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    '"$http_authorization" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    server {
        listen 80;
        server_name _;

        # ── Health / status endpoint (no auth required) ───────────────────
        location /health {
            proxy_pass http://vllm:8000/health;
        }

        # ── OpenAI-compatible API (auth required) ─────────────────────────
        location /v1/ {
            # Reject requests without a valid Bearer token
            if ($api_key_valid = 0) {
                return 401 '{"error":"Invalid or missing API key. '
                           'Use -H \"Authorization: Bearer <your-key>\"."}';
            }

            limit_req zone=api_limit burst=30 nodelay;

            # Long timeouts — inference can take time
            proxy_read_timeout    300s;
            proxy_connect_timeout  10s;
            proxy_send_timeout    300s;

            proxy_pass         http://vllm:8000/v1/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Streaming support (essential for SSE / token streaming)
            proxy_buffering    off;
            proxy_cache        off;
            chunked_transfer_encoding on;
        }

        # ── Friendly root message ─────────────────────────────────────────
        location / {
            return 200 '{"message":"Qwen3.5-9B API. Use /v1/chat/completions"}';
            add_header Content-Type application/json;
        }
    }
}
