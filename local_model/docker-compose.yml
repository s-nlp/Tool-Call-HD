services:

  # vLLM inference server
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen35-vllm:latest
    container_name: qwen35-vllm

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - HF_HOME=/cache/huggingface
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}

    volumes:
      - hf_cache:/cache/huggingface

    # Keep vLLM internal; Nginx below is the only public entry point.
    # If you want direct access without Nginx, expose: "8000:8000" here.
    expose:
      - "8000"

    # Override CMD here if you need different flags, e.g.:
    #   --max-model-len 131072   (for larger context on big GPUs)
    #   --language-model-only    (skips vision encoder, frees ~2 GB VRAM)
    #   --enable-auto-tool-choice --tool-call-parser qwen3_coder  (tool use)
    command: >
      --model               Qwen/Qwen3.5-9B
      --port                8000
      --host                0.0.0.0
      --tensor-parallel-size 2
      --max-model-len       32768
      --reasoning-parser    qwen3
      --served-model-name   qwen3.5-9b

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # model loading can take a while

  # ── Nginx reverse proxy (API-key auth + rate limiting) ────────────────────
  nginx:
    image: nginx:alpine
    container_name: qwen35-proxy
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "8080:80"           # change left side to your preferred public port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./api_keys.conf:/etc/nginx/api_keys.conf:ro
    restart: unless-stopped

volumes:
  hf_cache:
    driver: local